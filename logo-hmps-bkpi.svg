<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bkpiGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="bkpiYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <!-- Flower / Lotus / Star 8 Petals Badge Background -->
  <circle cx="100" cy="100" r="94" fill="#ffffff" stroke="url(#bkpiGreen)" stroke-width="5"/>
  <circle cx="100" cy="100" r="85" fill="#f0fdf4" stroke="url(#bkpiYellow)" stroke-width="3"/>

  <!-- Helping Hands / Caring Embracing Silhouette -->
  <!-- Left Hand / Wing -->
  <path d="M 52 110 C 50 85, 75 80, 90 92 C 80 98, 70 108, 68 128 C 60 125, 54 118, 52 110 Z" fill="url(#bkpiGreen)"/>
  <!-- Right Hand / Wing -->
  <path d="M 148 110 C 150 85, 125 80, 110 92 C 120 98, 130 108, 132 128 C 140 125, 146 118, 148 110 Z" fill="url(#bkpiGreen)"/>

  <!-- Heart (Empathy & Counseling) in Center -->
  <path d="M 100 82 C 92 65, 70 70, 75 92 C 80 110, 100 124, 100 124 C 100 124, 120 110, 125 92 C 130 70, 108 65, 100 82 Z" fill="url(#bkpiYellow)" stroke="#16a34a" stroke-width="1.5"/>

  <!-- Inner Sparkle/Torch (Guidance) -->
  <circle cx="100" cy="94" r="5" fill="#ffffff"/>

  <!-- Islamic Toga / Cap Silhouette Top -->
  <polygon points="100,44 125,54 100,64 75,54" fill="#15803d" stroke="#facc15" stroke-width="1.5"/>
  <rect x="94" y="62" width="12" height="7" rx="2" fill="#14532d" />
  <line x1="125" y1="54" x2="128" y2="68" stroke="#ca8a04" stroke-width="2" />

  <!-- Lower Banner for HMPS BKPI -->
  <rect x="42" y="142" width="116" height="24" rx="12" fill="url(#bkpiGreen)" stroke="#facc15" stroke-width="1.5" />
  <text x="100" y="158" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">HMPS BKPI</text>
  
  <text x="100" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#15803d" text-anchor="middle" letter-spacing="0.5">BIMBINGAN &amp; KONSELING</text>
  <text x="100" y="184" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="800" fill="#ca8a04" text-anchor="middle" letter-spacing="1">PENDIDIKAN ISLAM</text>
</svg>
